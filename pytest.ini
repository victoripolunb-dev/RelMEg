[pytest]
# Sem testpaths, um `pytest` na raiz recolhe também arquivos soltos e vira
# lento/instável. A suíte vive em tests/ — fixado aqui.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Zero-tolerance em warnings de deprecation de TERCEIROS (AGENTS.md / eng. de
# produção). Os avisos são originados no código interno de dependências já nas
# versões mais recentes (starlette 1.6.0, slowapi 0.1.10) e que ainda não
# corrigiram estes pontos. Suprimimos por MENSAGEM (regex), abrangendo qualquer
# hierarquia de warning e ponto de emissão (incl. import via importlib).
# Todo e qualquer outro warning de deprecation continua sendo exibido.
filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated.*
    ignore:.*asyncio\.iscoroutinefunction.* is deprecated.*
